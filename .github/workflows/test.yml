name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.20', '1.21', '1.22', '1.23', '1.24', '1.25.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # Go 1.21/1.22 (and sometimes 1.20) on current macos-latest
          # (macOS 26 dyld) abort with "missing LC_UUID load command".
          - os: macos-latest
            go-version: '1.20'
          - os: macos-latest
            go-version: '1.21'
          - os: macos-latest
            go-version: '1.22'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race ./...
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Build
        run: go build -v ./...
